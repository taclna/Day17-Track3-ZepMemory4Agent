name: vinuni-lab17-zep-memory

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ZEP_SEMANTIC_GRAPH_ID: ${ZEP_SEMANTIC_GRAPH_ID:-vinuni-lab17-domain-kb}
      LAB_CONTEXT_TOKENS: ${LAB_CONTEXT_TOKENS:-8000}
      PYTHONPATH: /workspace
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    command: ["sleep", "infinity"]
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  redis_data:
  qdrant_data:
